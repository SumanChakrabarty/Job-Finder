<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Radar — Ireland</title>
<style>
:root{--bg:#0b1119;--panel:#121a25;--panel2:#182231;--line:#263548;--ink:#f3f6fa;--muted:#91a0b4;--green:#48d09b;--amber:#edb24d;--red:#e97365;--blue:#7aafff;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;--mono:'SFMono-Regular',Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}.shell{max-width:1500px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:20;background:#0b1119f6;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.head{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 0 12px}.eyebrow{font:700 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin:0 0 4px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin:3px 0 0}.stats{display:flex;gap:18px;align-items:flex-end}.stat b{display:block;font-size:18px}.stat span{font:10px var(--mono);color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(260px,1.5fr) repeat(3,minmax(150px,.7fr));gap:8px;padding-bottom:10px}.control{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:12px;min-width:0}.context{display:flex;gap:10px;align-items:center;padding:0 0 12px;font-size:11px;color:var(--muted)}.status{margin-left:auto;font:10px var(--mono);color:var(--green)}.status.bad{color:var(--red)}main{padding:16px 0 64px}.views{display:flex;gap:6px;align-items:center;overflow:auto;padding-bottom:12px}.view{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:18px;padding:7px 11px;font:11px var(--mono);white-space:nowrap;cursor:pointer}.view.active{background:#1b2a3c;color:var(--ink);border-color:#45627f}.result{margin-left:auto;color:var(--muted);font:11px var(--mono);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:10px;min-height:185px}.card:hover{border-color:#4d6785;transform:translateY(-1px)}.card.strong{border-left:3px solid var(--green)}.card.good{border-left:3px solid var(--blue)}.company{font:700 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--green)}.title{font-size:15px;font-weight:750;line-height:1.35}.meta{display:flex;gap:5px;flex-wrap:wrap}.chip{font:10px var(--mono);padding:3px 7px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:var(--panel2)}.chip.fresh{color:var(--green);border-color:#48d09b55;background:#48d09b12}.chip.warn{color:var(--amber);border-color:#edb24d44;background:#edb24d12}.signal{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}.fit{font-weight:800}.fit.strong{color:var(--green)}.fit.good{color:var(--blue)}.fit.maybe{color:var(--amber)}.visa.good{color:#8ee5c3}.visa.bad{color:#f29a8d}.why{font-size:10.5px;color:var(--muted);line-height:1.35}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}.posted{font-size:11px;color:var(--muted)}.open{font-weight:700;color:var(--amber);font-size:11px}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font:12px var(--mono)}.directory{display:none}.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}.dir-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}.dir-name{font-size:13px;font-weight:700}.dir-sub{font:10px var(--mono);color:var(--muted);margin-top:4px}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.stats{display:none}}@media(max-width:600px){.shell{padding:0 11px}.toolbar{grid-template-columns:1fr}.toolbar .search{grid-column:auto}.grid{grid-template-columns:1fr}.result{display:none}.context{align-items:flex-start;flex-wrap:wrap}.status{margin-left:0}}

.auth-screen{position:fixed;inset:0;z-index:9999;background:radial-gradient(900px 420px at 50% -10%,#152439 0%,transparent 60%),var(--bg);display:grid;place-items:center;padding:20px}
.auth-card{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 24px 80px #0008}
.auth-card .eyebrow{margin-bottom:8px}.auth-card h2{margin:0 0 8px;font-size:24px}.auth-card p{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.5}
.auth-field{display:block;margin:0 0 12px}.auth-field span{display:block;margin:0 0 6px;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.auth-field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:11px 12px;outline:none}.auth-field input:focus{border-color:#4d6785}
.auth-button{width:100%;margin-top:6px;border:1px solid #4d6785;background:#1b2a3c;color:var(--ink);border-radius:8px;padding:11px 14px;font-weight:750;cursor:pointer}.auth-button:hover{border-color:var(--green)}
.auth-error{min-height:18px;margin-top:10px!important;margin-bottom:0!important;color:var(--red)!important;font:11px var(--mono)!important}
.auth-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font:10px var(--mono)}
.logout-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:6px 9px;font:10px var(--mono);cursor:pointer}.logout-btn:hover{color:var(--ink);border-color:#4d6785}
#app[hidden],.auth-screen[hidden]{display:none!important}

.cvbar{display:flex;align-items:center;gap:10px;padding:0 0 12px;font-size:11px;color:var(--muted);flex-wrap:wrap}.cv-upload{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:700}.cv-upload:hover{border-color:#4d6785}.cv-upload span{font-weight:400;color:var(--muted)}.cv-toggle{display:inline-flex;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:10px;color:var(--ink);cursor:pointer}.cv-toggle input{accent-color:var(--green)}.cv-toggle:has(input:disabled){opacity:.45;cursor:default}.cv-note{color:var(--muted)}.cvbar .status{margin-left:auto}@media(max-width:700px){.cv-note{width:100%;order:5}.cvbar .status{margin-left:0}}
</style></head><body>
<div id="authScreen" class="auth-screen">
  <form id="authForm" class="auth-card" autocomplete="on">
    <p class="eyebrow">Private access</p>
    <h2>Job Radar</h2>
    <p>Sign in to continue.</p>
    <label class="auth-field"><span>User ID</span><input id="authUser" type="text" autocomplete="username" required autofocus></label>
    <label class="auth-field"><span>Password</span><input id="authPass" type="password" autocomplete="current-password" required></label>
    <button class="auth-button" type="submit">Sign in</button>
    <p id="authError" class="auth-error" aria-live="polite"></p>
  </form>
</div>
<div id="app" hidden>
<div class="top"><div class="shell">
<div class="head"><div><p class="eyebrow">Ireland job search</p><h1>Job Radar</h1><p class="sub">All current Ireland roles in one place.</p></div><div class="stats"><div class="stat"><b id="sLive">0</b><span>LIVE JOBS</span></div><div class="stat"><b id="sToday">0</b><span>POSTED TODAY</span></div><div class="stat"><b id="sWeek">0</b><span>≤ 7 DAYS</span></div></div></div>
<div class="toolbar"><input id="fSearch" class="control search" placeholder="Search role, company or skill…"><select id="fPosted" class="control"><option value="any">Any posting date</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="3d">Posted ≤ 3 days</option><option value="7d">Posted ≤ 7 days</option><option value="14d">Posted ≤ 14 days</option><option value="30d">Posted ≤ 30 days</option><option value="unknown">Date unknown</option></select><select id="fLocation" class="control"><option value="">Anywhere in Ireland</option><option value="cork">Cork</option><option value="dublin">Dublin</option><option value="galway">Galway</option><option value="limerick">Limerick</option><option value="remote">Remote / Hybrid</option></select><select id="fVisa" class="control"><option value="">Any visa signal</option><option value="positive">Sponsorship / permit evidence</option><option value="posting">Posting mentions sponsorship</option><option value="permits">Company has permit history</option><option value="negative">Posting rules out sponsorship</option></select></div>
<div class="cvbar"><label class="cv-upload" for="cvFile">Upload CV <span>optional</span></label><input id="cvFile" type="file" accept=".pdf,.txt,text/plain,application/pdf" hidden><label class="cv-toggle"><input id="cvFilter" type="checkbox" disabled> <span>Filter using CV</span></label><span id="cvNote" class="cv-note">Upload a PDF or text CV only if you want personalised filtering.</span><span id="liveStatus" class="status">● connecting</span><button id="logoutBtn" class="logout-btn" type="button">Sign out</button></div>
</div></div>
<div class="shell"><main><div class="views"><button class="view active" data-view="all">All jobs</button><button class="view" data-view="fresh">Fresh ≤ 3 days</button><button class="view" data-view="visa">Visa-friendly</button><button class="view" data-view="zero">No current jobs</button><button class="view" data-view="manual">Fetch / Manual</button><div id="resultCount" class="result">0 jobs</div></div><section id="jobs"><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">No jobs match these filters.</div></section><section id="zero" class="directory"><div id="zeroGrid" class="dir-grid"></div></section><section id="manual" class="directory"><div id="manualGrid" class="dir-grid"></div></section></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let JOBS=[],RAW_COUNT=0,ZERO=[],MANUAL=[],SPONSOR={},OFFICIAL={},VIEW='all';
let CV_TEXT='',CV_TERMS=[],CV_ROLES=[],CV_ACTIVE=false;
const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function canonicalUrl(raw){try{const u=new URL(raw,location.href);u.hash='';['utm_source','utm_medium','utm_campaign','source','src'].forEach(k=>u.searchParams.delete(k));return u.toString().replace(/\/$/,'')}catch{return norm(raw)}}
// Keep the full feed. Only suppress records that point to the exact same job URL.
function dedupeJobs(rows){const out=[],seen=new Set();for(const j of rows){const u=canonicalUrl(j.url||'');if(u&&u!==location.href){if(seen.has(u))continue;seen.add(u)}out.push(j)}return out}
function visa(j){if(j.visa_sponsorship==='sponsors')return{kind:'posting',label:'Posting mentions sponsorship',score:3};if(j.visa_sponsorship==='no_sponsorship')return{kind:'negative',label:'Posting rules out sponsorship',score:-6};const o=OFFICIAL[j.company];if(o&&o.total_permits)return{kind:'permits',label:`Permit history: ${o.total_permits}`,score:2};const st=SPONSOR[j.company];if(st&&['frequent_positive','occasional_positive','rare_positive'].includes(st.category))return{kind:'history',label:st.label||'Past sponsorship evidence',score:1};return{kind:'neutral',label:'No sponsorship signal',score:0}}
function ageText(j){const d=j.posted_days_ago;if(d==null)return'Posting date unknown';if(d<=0)return'Posted today';if(d===1)return'Posted yesterday';return`Posted ${d} days ago`}
function passesDate(j,v){const d=j.posted_days_ago;if(v==='any')return true;if(v==='unknown')return d==null;if(d==null)return false;if(v==='today')return d<=0;if(v==='yesterday')return d===1;if(v==='3d')return d<=3;if(v==='7d')return d<=7;if(v==='14d')return d<=14;if(v==='30d')return d<=30;return true}
const STOP=new Set('a an and are as at be been being by for from has have i in into is it its of on or our that the their this to was were will with you your we my me us role work working experience years year team teams using use used strong excellent including across through within ability skills skill knowledge'.split(' '));
const ROLE_WORDS=['engineer','engineering','analyst','analytics','scientist','developer','consultant','architect','manager','specialist','administrator','designer','researcher','accountant','controller','recruiter','product','sales','marketing','operations','finance','risk','compliance','data','software','cloud','security','business','project','programme','program'];
function buildCvProfile(text){CV_TEXT=norm(text);const tokens=(CV_TEXT.match(/[a-z][a-z0-9+#.-]{2,}/g)||[]).filter(t=>!STOP.has(t)&&!/^\d+$/.test(t));const freq={};tokens.forEach(t=>freq[t]=(freq[t]||0)+1);CV_TERMS=Object.entries(freq).filter(([t,n])=>n>=1&&(n>=2||t.length>=5)).sort((a,b)=>b[1]-a[1]).slice(0,90).map(x=>x[0]);const lines=String(text).split(/\n+/).map(norm).filter(Boolean);const roles=[];for(const line of lines){if(line.length>90)continue;if(ROLE_WORDS.some(w=>line.includes(w))){const cleaned=line.replace(/[^a-z0-9+# &/.-]/g,' ').replace(/\s+/g,' ').trim();if(cleaned.length>=4&&cleaned.length<=70)roles.push(cleaned)}}CV_ROLES=[...new Set(roles)].slice(0,24)}
function cvScore(j){if(!CV_TEXT)return 0;const title=norm(j.title),body=norm(`${j.title||''} ${j.description||''} ${j.summary||''} ${j.company||''}`);let score=0;for(const r of CV_ROLES){if(r.length>4&&(title.includes(r)||r.includes(title)))score+=8;else{const parts=r.split(' ').filter(x=>x.length>3&&!STOP.has(x));const hit=parts.filter(x=>title.includes(x)).length;if(parts.length>=2&&hit>=2)score+=4}}let termHits=0,titleHits=0;for(const t of CV_TERMS){if(body.includes(t)){termHits++;if(title.includes(t))titleHits++}}score+=Math.min(termHits,12)*0.55+Math.min(titleHits,5)*1.6;return score}
function cvPass(j){if(!CV_ACTIVE)return true;return cvScore(j)>=3.0}
function priority(j){const d=j.posted_days_ago,rec=d==null?0:d<=1?5:d<=3?4:d<=7?3:d<=14?2:d<=30?1:-1;return (CV_ACTIVE?cvScore(j)*3:0)+rec+visa(j).score+(j.new_since_last_check?1:0)}
function loadData(data){RAW_COUNT=(data.live_jobs||[]).length;JOBS=dedupeJobs(data.live_jobs||[]);const raw=data.manual_check_companies||[],explicit=data.automated_zero_companies||data.currently_no_jobs_companies||data.zero_job_companies||[];const isZero=c=>/no ireland postings found|no current ireland jobs|currently no jobs|0 ireland/i.test(String(c.platform||c.status||c.reason||''));ZERO=explicit.length?explicit:raw.filter(isZero);const names=new Set(ZERO.map(c=>norm(c.company||c.company_name)));MANUAL=raw.filter(c=>!names.has(norm(c.company||c.company_name))&&!isZero(c));SPONSOR=data.company_sponsorship_stats||{};OFFICIAL=data.official_permit_stats||{};$('sLive').textContent=JOBS.length;$('sToday').textContent=JOBS.filter(j=>j.posted_days_ago!=null&&j.posted_days_ago<=0).length;$('sWeek').textContent=JOBS.filter(j=>j.posted_days_ago!=null&&j.posted_days_ago<=7).length;render()}
function render(){if(VIEW==='zero'||VIEW==='manual'){renderDirectory();return}$('jobs').style.display='block';$('zero').style.display='none';$('manual').style.display='none';const search=norm($('fSearch').value),posted=$('fPosted').value,loc=norm($('fLocation').value),visaF=$('fVisa').value;let rows=JOBS.filter(j=>{const hay=norm(`${j.title} ${j.company} ${j.location} ${j.description||''} ${j.summary||''}`),v=visa(j);if(search&&!hay.includes(search))return false;if(!passesDate(j,posted))return false;if(loc&&!norm(j.location).includes(loc))return false;if(visaF==='positive'&&!['posting','permits','history'].includes(v.kind))return false;if(visaF&&visaF!=='positive'&&v.kind!==visaF)return false;if(!cvPass(j))return false;if(VIEW==='fresh'&&(j.posted_days_ago==null||j.posted_days_ago>3))return false;if(VIEW==='visa'&&!['posting','permits','history'].includes(v.kind))return false;return true});rows.sort((a,b)=>priority(b)-priority(a)||(a.posted_days_ago??999)-(b.posted_days_ago??999));$('resultCount').textContent=`${rows.length} shown · ${JOBS.length} live jobs${RAW_COUNT!==JOBS.length?` · ${RAW_COUNT} source records`:''}`;$('grid').innerHTML='';$('empty').style.display=rows.length?'none':'block';rows.forEach(j=>$('grid').appendChild(card(j)))}
function card(j){const d=j.posted_days_ago,v=visa(j),score=CV_ACTIVE?cvScore(j):0,c=document.createElement('article');c.className='card';const ageCls=d!=null&&d<=3?'fresh':d!=null&&d>30?'warn':'';const cvLine=CV_ACTIVE?`<span class="fit ${score>=8?'strong':score>=4?'good':'maybe'}">${score>=8?'Strong match':score>=4?'Good match':'Possible match'}</span><span>·</span>`:'';c.innerHTML=`<div class="company">${esc(j.company)}</div><div class="title">${esc(j.title||'Untitled role')}</div><div class="meta"><span class="chip ${ageCls}">${esc(ageText(j))}</span><span class="chip">${esc(j.location||'—')}</span>${j.employment_type?`<span class="chip">${esc(j.employment_type)}</span>`:''}</div><div class="signal">${cvLine}<span class="visa ${v.kind==='negative'?'bad':['posting','permits','history'].includes(v.kind)?'good':''}">${esc(v.label)}</span></div><div class="foot"><span class="posted">${j.new_since_last_check?'New since last scan':''}</span><span class="open">Open exact job →</span></div>`;c.onclick=()=>window.open(j.url,'_blank','noopener');return c}
function renderDirectory(){$('jobs').style.display='none';$('zero').style.display=VIEW==='zero'?'block':'none';$('manual').style.display=VIEW==='manual'?'block':'none';const list=VIEW==='zero'?ZERO:MANUAL,grid=VIEW==='zero'?$('zeroGrid'):$('manualGrid'),search=norm($('fSearch').value);const rows=list.filter(c=>!search||norm(c.company||c.company_name).includes(search)).sort((a,b)=>String(a.company||a.company_name).localeCompare(String(b.company||b.company_name)));$('resultCount').textContent=`${rows.length} companies`;grid.innerHTML='';rows.forEach(c=>{const name=c.company||c.company_name||'Unknown company',url=c.url||c.career_url||'#',d=document.createElement('div');d.className='dir-card';d.innerHTML=`<div class="dir-name">${esc(name)}</div><div class="dir-sub">${VIEW==='zero'?'Checked successfully — no current Ireland jobs':'Fetching issue / check manually'}</div>`;d.onclick=()=>{if(url&&url!=='#')window.open(url,'_blank','noopener')};grid.appendChild(d)})}
function setView(v){VIEW=v;document.querySelectorAll('.view').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
async function extractPdf(file){if(!window.pdfjsLib)throw Error('PDF reader unavailable');const data=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();text+='\n'+content.items.map(x=>x.str).join(' ')}return text}
async function handleCv(file){if(!file)return;try{$('cvNote').textContent='Reading CV…';let text='';if(file.type==='application/pdf'||/\.pdf$/i.test(file.name))text=await extractPdf(file);else text=await file.text();if(norm(text).length<80)throw Error('Not enough readable text');buildCvProfile(text);$('cvFilter').disabled=false;$('cvFilter').checked=false;CV_ACTIVE=false;$('cvNote').textContent='Ready — turn on “Filter using CV” when you want it.';render()}catch(e){CV_TEXT='';CV_TERMS=[];CV_ROLES=[];CV_ACTIVE=false;$('cvFilter').checked=false;$('cvFilter').disabled=true;$('cvNote').textContent='Could not read that CV. Try a text-based PDF or .txt file.'}}
async function fetchJobs(){try{const r=await fetch('./jobs.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);loadData(await r.json());$('liveStatus').textContent='● live data connected';$('liveStatus').classList.remove('bad')}catch(e){$('liveStatus').textContent='○ jobs.json not connected';$('liveStatus').classList.add('bad')}}
let REFRESH_TIMER=null,DASHBOARD_STARTED=false;
function initDashboard(){if(DASHBOARD_STARTED)return;DASHBOARD_STARTED=true;['fSearch','fPosted','fLocation','fVisa'].forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render)});$('cvFile').addEventListener('change',e=>handleCv(e.target.files&&e.target.files[0]));$('cvFilter').addEventListener('change',e=>{CV_ACTIVE=!!e.target.checked;render()});document.querySelectorAll('.view').forEach(b=>b.onclick=()=>setView(b.dataset.view));fetchJobs();REFRESH_TIMER=setInterval(fetchJobs,5*60*1000)}
</script>
<script>
const AUTH_HASH='f2a39ab4a6577cb730bb6498aa46009668686a7518b2a3d04471b0bc0b17421c';
const AUTH_SESSION_KEY='job_radar_authenticated_v1';
const AUTH_SESSION_TTL_MS=8*60*60*1000;
async function authDigest(value){
  const bytes=new TextEncoder().encode(value);
  const hash=await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function authSessionValid(){
  try{const s=JSON.parse(sessionStorage.getItem(AUTH_SESSION_KEY)||'null');return !!(s&&s.ok&&Date.now()<s.expires)}catch{return false}
}
function showDashboard(){
  document.getElementById('authScreen').hidden=true;
  document.getElementById('app').hidden=false;
  if(typeof initDashboard==='function')initDashboard();
}
function signOut(){
  sessionStorage.removeItem(AUTH_SESSION_KEY);
  document.getElementById('app').hidden=true;
  document.getElementById('authScreen').hidden=false;
  document.getElementById('authPass').value='';
  document.getElementById('authUser').focus();
}
document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=document.getElementById('authUser').value.trim();
  const p=document.getElementById('authPass').value;
  const digest=await authDigest(u+':'+p);
  if(digest===AUTH_HASH){
    sessionStorage.setItem(AUTH_SESSION_KEY,JSON.stringify({ok:true,expires:Date.now()+AUTH_SESSION_TTL_MS}));
    document.getElementById('authError').textContent='';
    showDashboard();
  }else{
    document.getElementById('authError').textContent='Invalid user ID or password.';
    document.getElementById('authPass').value='';
    document.getElementById('authPass').focus();
  }
});
document.getElementById('logoutBtn').addEventListener('click',signOut);
window.addEventListener('load',()=>{if(authSessionValid())showDashboard();});
</script>
</div>
</body></html>
