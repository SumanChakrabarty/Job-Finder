<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Radar — Ireland</title>
<style>
:root{--bg:#0b1119;--panel:#121a25;--panel2:#182231;--line:#263548;--ink:#f3f6fa;--muted:#91a0b4;--green:#48d09b;--amber:#edb24d;--red:#e97365;--blue:#7aafff;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;--mono:'SFMono-Regular',Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}.shell{max-width:1500px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:20;background:#0b1119f6;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.head{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 0 12px}.eyebrow{font:700 10px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin:0 0 4px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin:3px 0 0}.stats{display:flex;gap:18px;align-items:flex-end}.stat b{display:block;font-size:18px}.stat span{font:10px var(--mono);color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(260px,1.5fr) repeat(3,minmax(150px,.7fr));gap:8px;padding-bottom:10px}.control{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:12px;min-width:0}.context{display:flex;gap:10px;align-items:center;padding:0 0 12px;font-size:11px;color:var(--muted)}.status{margin-left:auto;font:10px var(--mono);color:var(--green)}.status.bad{color:var(--red)}main{padding:16px 0 64px}.views{display:flex;gap:6px;align-items:center;overflow:auto;padding-bottom:12px}.view{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:18px;padding:7px 11px;font:11px var(--mono);white-space:nowrap;cursor:pointer}.view.active{background:#1b2a3c;color:var(--ink);border-color:#45627f}.result{margin-left:auto;color:var(--muted);font:11px var(--mono);white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:10px;min-height:185px}.card:hover{border-color:#4d6785;transform:translateY(-1px)}.card.strong{border-left:3px solid var(--green)}.card.good{border-left:3px solid var(--blue)}.company{font:700 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--green)}.title{font-size:15px;font-weight:750;line-height:1.35}.meta{display:flex;gap:5px;flex-wrap:wrap}.chip{font:10px var(--mono);padding:3px 7px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:var(--panel2)}.chip.fresh{color:var(--green);border-color:#48d09b55;background:#48d09b12}.chip.warn{color:var(--amber);border-color:#edb24d44;background:#edb24d12}.signal{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}.fit{font-weight:800}.fit.strong{color:var(--green)}.fit.good{color:var(--blue)}.fit.maybe{color:var(--amber)}.visa.good{color:#8ee5c3}.visa.bad{color:#f29a8d}.why{font-size:10.5px;color:var(--muted);line-height:1.35}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}.posted{font-size:11px;color:var(--muted)}.open{font-weight:700;color:var(--amber);font-size:11px}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font:12px var(--mono)}.directory{display:none}.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}.dir-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}.dir-name{font-size:13px;font-weight:700}.dir-sub{font:10px var(--mono);color:var(--muted);margin-top:4px}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.stats{display:none}}@media(max-width:600px){.shell{padding:0 11px}.toolbar{grid-template-columns:1fr}.toolbar .search{grid-column:auto}.grid{grid-template-columns:1fr}.result{display:none}.context{align-items:flex-start;flex-wrap:wrap}.status{margin-left:0}}
</style></head><body>
<div class="top"><div class="shell">
<div class="head"><div><p class="eyebrow">Ireland job search</p><h1>Job Radar</h1><p class="sub">Fresh, relevant Ireland roles first — focus on opportunities worth opening.</p></div><div class="stats"><div class="stat"><b id="sRelevant">0</b><span>RELEVANT</span></div><div class="stat"><b id="sToday">0</b><span>POSTED TODAY</span></div><div class="stat"><b id="sWeek">0</b><span>≤ 7 DAYS</span></div></div></div>
<div class="toolbar"><input id="fSearch" class="control search" placeholder="Search within your matches…"><select id="fPosted" class="control"><option value="7d">Posted ≤ 7 days</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="3d">Posted ≤ 3 days</option><option value="14d">Posted ≤ 14 days</option><option value="30d">Posted ≤ 30 days</option><option value="any">Any posting date</option><option value="unknown">Date unknown</option></select><select id="fLocation" class="control"><option value="">Anywhere in Ireland</option><option value="cork">Cork</option><option value="dublin">Dublin</option><option value="galway">Galway</option><option value="limerick">Limerick</option><option value="remote">Remote / Hybrid</option></select><select id="fVisa" class="control"><option value="">Any visa signal</option><option value="positive">Sponsorship / permit evidence</option><option value="posting">Posting mentions sponsorship</option><option value="permits">Company has permit history</option><option value="negative">Posting rules out sponsorship</option></select></div>
<div class="context"><span>Relevance, freshness and visa signals are combined automatically.</span><span id="liveStatus" class="status">● connecting</span></div>
</div></div>
<div class="shell"><main><div class="views"><button class="view active" data-view="cv">Best matches</button><button class="view" data-view="fresh">Fresh matches ≤ 3 days</button><button class="view" data-view="visa">Visa-friendly matches</button><button class="view" data-view="all">All unique jobs</button><button class="view" data-view="zero">No current jobs</button><button class="view" data-view="manual">Fetch / Manual</button><div id="resultCount" class="result">0 jobs</div></div><section id="jobs"><div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">No jobs match these filters.</div></section><section id="zero" class="directory"><div id="zeroGrid" class="dir-grid"></div></section><section id="manual" class="directory"><div id="manualGrid" class="dir-grid"></div></section></main></div>
<script>
let JOBS=[],RAW_COUNT=0,ZERO=[],MANUAL=[],SPONSOR={},OFFICIAL={},VIEW='cv';
const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const CV={primary:['data engineer','azure data engineer','cloud data engineer','data platform engineer','data integration engineer','etl engineer','analytics engineer','big data engineer','data warehouse engineer','databricks engineer','bi engineer','business intelligence engineer'],secondary:['data analyst','business intelligence analyst','bi analyst','analytics consultant','data consultant','business analyst','reporting analyst','data developer','database developer'],skills:['python','pyspark','spark','sql','t-sql','databricks','azure data factory','adf','adls','synapse','power bi','ssas','ssrs','etl','elt','dimensional model','data warehouse','informatica','azure'],exclude:[/account executive/,/sales/,/payroll/,/recruit/,/talent acquisition/,/human resources|\bhr\b/,/scientist/,/clinical/,/medical/,/nurse/,/pharmac/,/regulatory/,/legal/,/counsel/,/marketing/,/customer success/,/abuse investigator/,/security guard/,/procurement/,/supply chain/,/mechanical engineer/,/electrical engineer/,/civil engineer/]};
function canonicalUrl(u){try{const x=new URL(u,location.href);x.hash='';['utm_source','utm_medium','utm_campaign','source','src'].forEach(k=>x.searchParams.delete(k));return x.href.replace(/\/$/,'')}catch{return norm(u)}}
function dedupeJobs(rows){const out=[],seenUrl=new Set(),seenFallback=new Set();for(const j of rows){const u=canonicalUrl(j.url||''),fallback=norm(`${j.company}|${j.title}|${j.location}`);if(u&&u!==location.href&&seenUrl.has(u))continue;if(seenFallback.has(fallback))continue;if(u&&u!==location.href)seenUrl.add(u);seenFallback.add(fallback);out.push(j)}return out}
function visa(j){if(j.visa_sponsorship==='sponsors')return{kind:'posting',label:'Posting mentions sponsorship',score:3};if(j.visa_sponsorship==='no_sponsorship')return{kind:'negative',label:'Posting rules out sponsorship',score:-6};const o=OFFICIAL[j.company];if(o&&o.total_permits)return{kind:'permits',label:`Permit history: ${o.total_permits}`,score:2};const s=SPONSOR[j.company];if(s&&['frequent_positive','occasional_positive','rare_positive'].includes(s.category))return{kind:'history',label:s.label||'Past sponsorship evidence',score:1};return{kind:'neutral',label:'No sponsorship signal',score:0}}
function ageText(j){const d=j.posted_days_ago;if(d==null)return'Posting date unknown';if(d<=0)return'Posted today';if(d===1)return'Posted yesterday';return`Posted ${d} days ago`}
function cvFit(j){const title=norm(j.title),body=norm(`${j.title} ${j.description||''} ${j.summary||''}`);if(CV.exclude.some(r=>r.test(title)))return{rank:0,level:'low',label:'Low relevance',why:'This role is outside the main target area.'};let role=0,matchedRole='';for(const x of CV.primary){if(title.includes(x)){role=4;matchedRole=x;break}}if(!role)for(const x of CV.secondary){if(title.includes(x)){role=2;matchedRole=x;break}}if(!role&&/\bdata\b/.test(title)&&/(engineer|analytics|analyst|platform|warehouse|integration|etl|bi\b)/.test(title)){role=3;matchedRole='data-focused title'}
const matchedSkills=CV.skills.filter(x=>body.includes(x));let rank=role+(matchedSkills.length>=4?2:matchedSkills.length>=1?1:0);if(/director|head of|vice president|\bvp\b|senior manager|principal|staff/.test(title))rank-=2;else if(/manager/.test(title)&&!/data engineering manager|analytics manager/.test(title))rank-=1;if(/intern|graduate|apprentice/.test(title))rank-=1;rank=Math.max(0,rank);const level=rank>=5?'strong':rank>=3?'good':rank>=2?'maybe':'low';const label=rank>=5?'Strong match':rank>=3?'Good match':rank>=2?'Possible match':'Low relevance';const why=[matchedRole?`title: ${matchedRole}`:'',matchedSkills.length?`skills: ${matchedSkills.slice(0,4).join(', ')}`:''].filter(Boolean).join(' · ')||'limited overlap in available job data';return{rank,level,label,why}}
function priority(j){const f=cvFit(j),d=j.posted_days_ago,rec=d==null?0:d<=1?5:d<=3?4:d<=7?3:d<=14?2:d<=30?1:-1;return f.rank*4+rec+visa(j).score+(j.new_since_last_check?1:0)}
function passesDate(j,v){const d=j.posted_days_ago;if(v==='any')return true;if(v==='unknown')return d==null;if(d==null)return false;if(v==='today')return d<=0;if(v==='yesterday')return d===1;if(v==='3d')return d<=3;if(v==='7d')return d<=7;if(v==='14d')return d<=14;if(v==='30d')return d<=30;return true}
function loadData(data){RAW_COUNT=(data.live_jobs||[]).length;JOBS=dedupeJobs(data.live_jobs||[]);const raw=data.manual_check_companies||[],explicit=data.automated_zero_companies||data.currently_no_jobs_companies||data.zero_job_companies||[];const isZero=c=>/no ireland postings found|no current ireland jobs|currently no jobs|0 ireland/i.test(String(c.platform||c.status||c.reason||''));ZERO=explicit.length?explicit:raw.filter(isZero);const names=new Set(ZERO.map(c=>norm(c.company||c.company_name)));MANUAL=raw.filter(c=>!names.has(norm(c.company||c.company_name))&&!isZero(c));SPONSOR=data.company_sponsorship_stats||{};OFFICIAL=data.official_permit_stats||{};const relevant=JOBS.filter(j=>cvFit(j).rank>=2);$('sRelevant').textContent=relevant.length;$('sToday').textContent=relevant.filter(j=>j.posted_days_ago!=null&&j.posted_days_ago<=0).length;$('sWeek').textContent=relevant.filter(j=>j.posted_days_ago!=null&&j.posted_days_ago<=7).length;render()}
function render(){if(VIEW==='zero'||VIEW==='manual'){renderDirectory();return}$('jobs').style.display='block';$('zero').style.display='none';$('manual').style.display='none';const search=norm($('fSearch').value),posted=$('fPosted').value,loc=norm($('fLocation').value),visaF=$('fVisa').value;let rows=JOBS.filter(j=>{const hay=norm(`${j.title} ${j.company} ${j.location} ${j.description||''} ${j.summary||''}`),v=visa(j),f=cvFit(j);if(search&&!hay.includes(search))return false;if(!passesDate(j,posted))return false;if(loc&&!norm(j.location).includes(loc))return false;if(visaF==='positive'&&!['posting','permits','history'].includes(v.kind))return false;if(visaF&&visaF!=='positive'&&v.kind!==visaF)return false;if(VIEW==='cv'&&f.rank<2)return false;if(VIEW==='fresh'&&(f.rank<2||j.posted_days_ago==null||j.posted_days_ago>3))return false;if(VIEW==='visa'&&(f.rank<2||!['posting','permits','history'].includes(v.kind)))return false;return true});if(VIEW==='all')rows.sort((a,b)=>(a.posted_days_ago??999)-(b.posted_days_ago??999));else rows.sort((a,b)=>priority(b)-priority(a)||(a.posted_days_ago??999)-(b.posted_days_ago??999));$('resultCount').textContent=`${rows.length} shown · ${JOBS.length} unique from ${RAW_COUNT} source records`;$('grid').innerHTML='';$('empty').style.display=rows.length?'none':'block';rows.forEach(j=>$('grid').appendChild(card(j)))}
function card(j){const d=j.posted_days_ago,v=visa(j),f=cvFit(j),c=document.createElement('article');c.className='card '+(f.level==='strong'?'strong':f.level==='good'?'good':'');const ageCls=d!=null&&d<=3?'fresh':d!=null&&d>30?'warn':'';c.innerHTML=`<div class="company">${esc(j.company)}</div><div class="title">${esc(j.title||'Untitled role')}</div><div class="meta"><span class="chip ${ageCls}">${esc(ageText(j))}</span><span class="chip">${esc(j.location||'—')}</span>${j.employment_type?`<span class="chip">${esc(j.employment_type)}</span>`:''}</div><div class="signal"><span class="fit ${f.level}">${esc(f.label)}</span><span>·</span><span class="visa ${v.kind==='negative'?'bad':['posting','permits','history'].includes(v.kind)?'good':''}">${esc(v.label)}</span></div><div class="why">${esc(f.why)}</div><div class="foot"><span class="posted">${j.new_since_last_check?'New since last scan':''}</span><span class="open">Open exact job →</span></div>`;c.onclick=()=>window.open(j.url,'_blank','noopener');return c}
function renderDirectory(){$('jobs').style.display='none';$('zero').style.display=VIEW==='zero'?'block':'none';$('manual').style.display=VIEW==='manual'?'block':'none';const list=VIEW==='zero'?ZERO:MANUAL,grid=VIEW==='zero'?$('zeroGrid'):$('manualGrid'),search=norm($('fSearch').value);const rows=list.filter(c=>!search||norm(c.company||c.company_name).includes(search)).sort((a,b)=>String(a.company||a.company_name).localeCompare(String(b.company||b.company_name)));$('resultCount').textContent=`${rows.length} companies`;grid.innerHTML='';rows.forEach(c=>{const name=c.company||c.company_name||'Unknown company',url=c.url||c.career_url||'#',d=document.createElement('div');d.className='dir-card';d.innerHTML=`<div class="dir-name">${esc(name)}</div><div class="dir-sub">${VIEW==='zero'?'Checked successfully — no current Ireland jobs':'Fetching issue / check manually'}</div>`;d.onclick=()=>{if(url&&url!=='#')window.open(url,'_blank','noopener')};grid.appendChild(d)})}
function setView(v){VIEW=v;document.querySelectorAll('.view').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='all'&&$('fPosted').value==='7d')$('fPosted').value='any';render()}
async function fetchJobs(){try{const r=await fetch('./jobs.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);loadData(await r.json());$('liveStatus').textContent='● live data connected';$('liveStatus').classList.remove('bad')}catch(e){$('liveStatus').textContent='○ jobs.json not connected';$('liveStatus').classList.add('bad')}}
['fSearch','fPosted','fLocation','fVisa'].forEach(id=>{$(id).addEventListener('input',render);$(id).addEventListener('change',render)});document.querySelectorAll('.view').forEach(b=>b.onclick=()=>setView(b.dataset.view));fetchJobs();setInterval(fetchJobs,5*60*1000);
</script></body></html>
