name: refresh-official-visa-stats

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Run official visa stats fetch
        run: python visa_stats.py

      - name: Commit updated stats file
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add official_permit_stats.json
          git commit -m "Refresh official DETE permit stats $(date -u +'%Y-%m')" || echo "No changes to commit"
          git push
