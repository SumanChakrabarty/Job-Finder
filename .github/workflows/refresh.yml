name: refresh-jobs
on:
  schedule:
    # GitHub's practical minimum reliable interval is ~15 min; it can lag
    # a few minutes further during busy periods — that's normal for free
    # scheduled Actions, not a bug in this workflow.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Real fix for "! [rejected] main -> main (fetch first)": if one run takes
# longer than the 15-minute schedule, the next run starts and checks out
# the repo before the first run has finished and pushed. Both runs then
# try to push, and the second one is correctly rejected since the remote
# moved on after its checkout. This ensures only one run is ever actually
# in progress at a time — a new scheduled trigger waits for the current
# run to finish rather than starting a race against it.
concurrency:
  group: refresh-jobs
  cancel-in-progress: false

permissions:
  contents: write   # to commit jobs.json back to the repo
  issues: write      # to open the "new jobs found" notification issue
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests openpyxl curl_cffi playwright
          python -m playwright install --with-deps chromium
      - name: Run job pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u job_pipeline.py
      - name: Commit updated data files
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json sponsorship_history.json seen_jobs.json ats_platform_cache.json jsonld_cache.json browser_scrape_cache.json
          git commit -m "Refresh job data $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          # Safety net: even with concurrency control above, pull any
          # last-second remote changes and rebase our commit on top before
          # pushing, rather than failing outright if a race still occurs.
          git pull --rebase origin main
          git push
