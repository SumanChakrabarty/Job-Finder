name: refresh-jobs
on:
  schedule:
    # GitHub's practical minimum reliable interval is ~15 min; it can lag
    # a few minutes further during busy periods — that's normal for free
    # scheduled Actions, not a bug in this workflow.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Prevents overlapping runs from racing to push at the same time.
concurrency:
  group: refresh-jobs
  cancel-in-progress: false

permissions:
  contents: write   # to commit jobs.json back to the repo
  issues: write      # to open the "new jobs found" notification issue
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests openpyxl curl_cffi playwright
          python -m playwright install --with-deps chromium
      - name: Run job pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u job_pipeline.py
      - name: Commit updated data files
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json sponsorship_history.json seen_jobs.json ats_platform_cache.json jsonld_cache.json browser_scrape_cache.json
          git commit -m "Refresh job data $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          # Real fix for a run that hung for over an hour: a plain
          # "git pull --rebase" can hit a genuine conflict (very likely
          # here, since every run rewrites the same data files) and then
          # STOP AND WAIT for a human to resolve it manually — which never
          # happens in CI, so it hangs indefinitely. -X ours tells git to
          # automatically resolve any conflict by keeping THIS run's
          # freshly-generated content, which is exactly the right call for
          # auto-generated output files where "the latest run wins" is the
          # correct behavior anyway — there's nothing here worth manually
          # merging line-by-line.
          git pull --rebase -X ours origin main
          git push
